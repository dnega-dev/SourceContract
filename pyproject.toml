[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcecontract"
version = "0.1.0"
description = "Deterministic conformance tests for official-source ingestion adapters"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "SourceContract contributors"}]
keywords = ["ingestion", "conformance", "provenance", "fixtures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dnega-dev/SourceContract"
Repository = "https://github.com/dnega-dev/SourceContract"
Issues = "https://github.com/dnega-dev/SourceContract/issues"
Changelog = "https://github.com/dnega-dev/SourceContract/blob/main/CHANGELOG.md"

[project.scripts]
sourcecontract = "sourcecontract.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sourcecontract.fixtures" = ["*.fixture.json", "data/*.json", "data/*.xml"]
